[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidchat"
version = "0.1.0"
description = "Terminal chat over a YouTube video via a temporary Gemini Notebook (NotebookLM) workspace."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "notebooklm-py>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vidchat = "vidchat.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vidchat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
